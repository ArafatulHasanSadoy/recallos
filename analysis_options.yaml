include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.drift.dart"
    # Vendored upstream code. We hold it to its own standards, not ours —
    # linting it would only produce noise we are not going to act on.
    # See third_party/tesseract_ocr/PATCHES.md.
    - "third_party/**"
  errors:
    # Unawaited futures in an app that does background OCR are real bugs, not style.
    unawaited_futures: error
    # Drift generates large files; keep our own code honest instead.
    todo: ignore
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_parenthesis
    - use_super_parameters
