  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;

    var p = document.body || document.documentElement;

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page

    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';
    function trustedOrigin(e) {

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;

              totalLen += value.length;

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

cause a company can have branches; it is not a single line. There is no stat strip and no note aggregation here: the graph does not model org→notes, so anything of that shape would need a new query and is out of scope for a restyle. Header actions match Person's: Save to contacts, Share.\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 09 NEEDS ATTENTION -->\n      <div style=\"width:390px;flex:none\">\n        <div style=\"display:flex;align-items:baseline;gap:9px;margin-bottom:12px\"><span style=\"font-family:'Instrument Serif',serif;font-size:19px;color:#4A4132\">09<\u002Fspan><span style=\"font-size:12.5px;font-weight:600;color:#1F1B13\">Needs attention<\u002Fspan><\u002Fdiv>\n        <div style=\"width:390px;height:844px;border-radius:44px;overflow:hidden;background:#E4DAC5;box-shadow:0 30px 60px -18px rgba(30,24,14,.45);position:relative;display:flex;flex-direction:column\">\n          <div style=\"height:52px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px;font-size:13px;font-weight:600;color:#3A3225\"><span>9:41<\u002Fspan><span style=\"letter-spacing:2px\">▮▮▮ ᯤ ▰<\u002Fspan><\u002Fdiv>\n          <div style=\"flex:none;padding:14px 24px 0;display:flex;align-items:center\"><span style=\"font-size:22px;color:#1F1B13\">‹<\u002Fspan><\u002Fdiv>\n          <div style=\"flex:none;padding:22px 24px 0\">\n            <div style=\"font-family:'Instrument Serif',serif;font-size:34px;line-height:1.04;color:#1F1B13\">Two cards did not<br>read cleanly<\u002Fdiv>\n            <div style=\"margin-top:10px;font-size:14px;line-height:1.5;color:#6B6047\">Open one to fix it by hand, or try reading them all again — the same card often reads better on a second run.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:none;margin:18px 24px 0;height:54px;border-radius:27px;background:#1F1B13;display:flex;align-items:center;justify-content:center;gap:10px\">\n            <svg width=\"17\" height=\"17\" sc-camel-view-box= rd was read\") — and they need different things from the user, so the cap rail and dot are vermilion for the first and ochre for the second. There is no per-field guess and no dismiss action: the row pushes to card detail, where the field list is the repair tool. The bulk retry is <code>_retryAll<\u002Fcode> — sequential, not parallel, because the recogniser is one native resource and four concurrent full-res decodes is how you get OOM-killed on a 3 GB phone; the button label carries its own progress. Recently deleted is a <em>section of this screen<\u002Fem> today (see frame 10 for the case for pulling it out).\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 10 RECENTLY DELETED -->\n      <div style=\"width:390px;flex:none\">\n        <div style=\"display:flex;align-items:baseline;gap:9px;margin-bottom:12px\"><span style=\"font-family:'Instrument Serif',serif;font-size:19px;color:#4A4132\">10<\u002Fspan><span style=\"font-size:12.5px;font-weight:600;color:#1F1B13\">Recently deleted<\u002Fspan><\u002Fdiv>\n        <div style=\"width:390px;height:844px;border-radius:44px;overflow:hidden;background:#DCD1BA;box-shadow:0 30px 60px -18px rgba(30,24,14,.45);position:relative;display:flex;flex-direction:column\">\n          <div style=\"height:52px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px;font-size:13px;font-weight:600;color:#3A3225\"><span>9:41<\u002Fspan><span style=\"letter-spacing:2px\">▮▮▮ ᯤ ▰<\u002Fspan><\u002Fdiv>\n          <div style=\"flex:none;padding:14px 24px 0;display:flex;align-items:center\">\n            <span style=\"font-size:22px;color:#1F1B13\">‹<\u002Fspan><span style=\"flex:1\"><\u002Fspan>\n            <span style=\"font-size:13.5px;font-weight:600;color:#A8401C\">Empty now<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:none;padding:22px 24px 0\">\n            <div style=\"font-family:'Instrument Serif',serif;font-size:36px;line-height:1.04;color:#1F1B13\">Recently deleted<\u x:1;height:1px;background:#2C2821\"><\u002Fspan>\n            <span style=\"font-family:'Instrument Serif',serif;font-size:20px;color:#B5AC98\">24<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;position:relative;overflow:hidden\">\n            <div style=\"position:absolute;inset:0;padding:0 22px\">\n              <div style=\"position:relative;height:100%\">\n                <sc-for list=\"{{ stackDark }}\" as=\"c\" hint-placeholder-count=\"4\">\n                  <div style=\"{{ c.wrap }}\">\n                    <div style=\"position:absolute;inset:0;border-radius:16px;background:#1D1A15;box-shadow:0 -1px 0 rgba(240,234,220,.08) inset,0 14px 26px -10px rgba(0,0,0,.75);border:1px solid #2C2821\"><\u002Fdiv>\n                    <div style=\"position:relative;height:100%;display:flex;padding:13px 14px;gap:13px\">\n                      <div style=\"{{ c.face }}\">\n                        <div style=\"{{ c.fold }}\"><\u002Fdiv>\n                        <div style=\"position:absolute;left:9px;top:10px;width:15px;height:15px;border-radius:4px;background:rgba(240,234,220,.16)\"><\u002Fdiv>\n                        <div style=\"position:absolute;left:9px;bottom:22px;width:52px;height:5px;border-radius:3px;background:rgba(240,234,220,.3)\"><\u002Fdiv>\n                        <div style=\"position:absolute;left:9px;bottom:13px;width:34px;height:4px;border-radius:2px;background:rgba(240,234,220,.14)\"><\u002Fdiv>\n                        <div style=\"position:absolute;left:9px;bottom:6px;width:42px;height:4px;border-radius:2px;background:rgba(240,234,220,.14)\"><\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"flex:1;min-width:0;display:flex;flex-direction:column\">\n                        <div style=\"display:flex;align-items:center;gap:7px\">\n                          <div style=\"font-family:'Instrument Serif',serif;font-size:22px;line-height:1.1;color:#F0EADC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ c.title }}<\u002Fdiv>\n                          <sc-if value=\"{{ c.flag }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:7px;height:7px;border-radius:50%;background:#E0641F;flex:none\"><\u002Fspan><\u002Fsc-if>\n                        <\u002Fdiv>\n                        <div style=\"margin-top:5px;font-size:13px;line-height:1.42;color:#8A8271;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ c.note }}<\u002Fdiv>\n                        <div style=\"margin-top:7px;font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#6E6757\">{{ c.meta }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:absolute;left:0;right:0;bottom:0;height:132px;background:linear-gradient(to bottom,rgba(21,19,15,0),#15130F 62%)\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:absolute;left:24px;right:24px;bottom:34px;height:58px;border-radius:29px;background:#D8A31A;display:flex;align-items:center;justify-content:center;gap:11px\">\n            <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15130F\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M3 12h18\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-size:15.5px;font-weight:700;color:#15130F\">Scan a card<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"position:absolute;left:50%;transform:translateX(-50%);bottom:9px;width:128px;height:5px;border-radius:3px;background:rgba(244,238,224,.32)\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:14px;font-size:13px;line-height:1.55;color:#3A3225;background:#FBF7EE;border-radius:12px;padding:14px 16px;border:1px solid #DBCFB6\">\n          <b>Flutter:<\u002Fb> dark is not an inversion. Two things swap role: the pocket goes <em>darker<\u002Fem> than the page (a hole, not a raised field), and ochre takes over the primary button because ink-on-ink has no contrast. Everything else keeps its light-mode geometry, so one widget tree serves both.\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nclass Component extends DCLogic {\n  renderVals() {\n    // A business card is landscape, 3.5×2in. The thumbnail keeps that ratio —\n    // a portrait crop of a landscape object stops reading as a card at all.\n    const face = (tint) =>\n      `position:relative;width:104px;height:64px;border-radius:8px;background:${tint};flex:none;overflow:hidden;border:1px solid rgba(31,27,19,.1)`;\n    const foldStyle = (on, c) =>\n      on\n        ? `position:absolute;top:0;right:0;width:0;height:0;border-top:19px solid ${c};border-left:19px solid transparent`\n        : \"display:none\";\n\n    const rows = [\n      { title: \"Sharif Printing\", note: \"Cheapest for 20+ tees. Slow on delivery.\", meta: \"Farmgate · 3d\", tint: \"#DCCFB4\", flag: false, fold: true },\n      { title: \"Nabil Fabrics\", note: \"Cotton wholesale. Ask for Nabil directly.\", meta: \"Islampur · 1w\", tint: \"#D3D6C0\", flag: false, fold: true },\n      { title: \"Unread card\", note: \"Back was blurry — phone number missing.\", meta: \"Needs attention\", tint: \"#DFCBBE\", flag: true, fold: false },\n      { title: \"Rahman Electric\", note: \"Rewired the shop. Fair price, same day.\", meta: \"Mirpur · 2w\", tint: \"#D8CDBC\", flag: true, fold: true },\n    ];\n\n    const stack = rows.map((r, i) => ({\n      ...r,\n      wrap: `position:absolute;left:0;right:0;top:${i * 92}px;height:116px;`,\n      face: face(r.tint),\n      fold: foldStyle(r.fold, \"#C8901A\"),\n    }));\n\n    const darkTints = [\"#2E2A21\", \"#2A2E24\", \"#332821\", \"#2C2822\"];\n    const stackDark = rows.map((r, i) => ({\n      ...r,\n      wrap: `position:absolute;left:0;right:0;top:${i * 92}px;height:116px;`,\n      face: face(darkTints[i]).replace(\"rgba(31,27,19,.1)\", \"rgba(240,234,220,.08)\"),\n      fold: foldStyle(r.fold, \"#D8A31A\"),\n    }));\n\n    const hits = [\n      { title: \"Sharif Printing\", note: \"Cheapest for 20+ tees. Slow on delivery.\", tint: \"#DCCFB4\", why: \"your note · price\", w: 100 },\n      { title: \"Meherun Tailors\", note: \"Fast on alterations, closed Fridays.\", tint: \"#D6D2C2\", why: \"similar meaning\", w: 62 },\n      { title: \"SH Packaging\", note: \"Did the Eid boxes. Quality held up.\", tint: \"#DFD6C2\", why: \"your note\", w: 41 },\n    ].map((h) => ({\n      ...h,\n      face: face(h.tint),\n      fold: foldStyle(true, \"#C8901A\"),\n      barTrack: \"width:56px;height:4px;border-radius:2px;background:#E3D9C4;flex:none;display:block;position:relative;overflow:hidden\",\n      barFill: `position:absolute;left:0;top:0;bottom:0;width:${h.w}%;background:#C8901A;border-radius:2px;display:block`,\n    }));\n\n    const conf = { ok: \"#7A8A5E\", low: \"#C8901A\", bad: \"#D9502A\" };\n    // Field keys as `card_extractor` actually emits them. `selected` is the row\n    // whose region_rect is boxed on the photo above — the mechanic that makes\n    // an extracted value checkable against the printing.\n    const fields = [\n      { label: \"Name\", value: \"Md. Sharif Hossain\", c: \"ok\", sel: false },\n      { label: \"Business\", value: \"Sharif Printing\", c: \"ok\", sel: false },\n      { label: \"Phone\", value: \"+880 1712 445 908\", c: \"ok\", sel: false },\n      { label: \"Address\", value: \"12/B Indira Rd, Farmgate\", c: \"low\", sel: true },\n    ].map((f, i, a) => ({\n      ...f,\n      row: `display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:9px;${f.sel ? \"background:#EFE6D2;box-shadow:inset 0 0 0 1.5px #C8901A;\" : \"\"}${i < a.length - 1 && !f.sel ? \"border-bottom:1px solid #D2C6AD\" : \"\"}`,\n      dot: `width:7px;height:7px;border-radius:50%;background:${conf[f.c]};flex:none`,\n    }));\n\n    // Card detail shows the same EditableFieldList. The trailing slot is the\n    // confidence dot, not a launch button — the actions live in the chip row,\n    // because `_Actions` derives them from which fields exist.\n    const detailFields = [\n      { label: \"Name\", value: \"Md. Sharif Hossain\", c: \"ok\", sel: false },\n      { label: \"Phone\", value: \"+880 1712 445 908\", c: \"ok\", sel: false },\n      { label: \"Email\", value: \"sharif.print@gmail.com\", c: \"ok\", sel: false },\n      { label: \"Address\", value: \"12/B Indira Rd, Farmgate\", c: \"low\", sel: true },\n    ].map((f) => ({\n      ...f,\n      row: `display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;${f.sel ? \"background:#EFE6D2;box-shadow:inset 0 0 0 1.5px #C8901A;\" : \"border-bottom:1px solid #D2C6AD\"}`,\n      dot: `width:7px;height:7px;border-radius:50%;background:${conf[f.c]};flex:none`,\n    }));\n\n    // Exactly the four in `_Actions`, in its order. WhatsApp appears only when\n    // the primary phone passes `PhoneExtractor.isMobile` — a landline wa.me\n    // link opens to an error, which reads as the app being broken.\n    const actionChips = [\n      { label: \"Call\", primary: true },\n      { label: \"WhatsApp\", primary: false },\n      { label: \"Email\", primary: false },\n      { label: \"Map\", primary: false },\n    ].map((a) => ({\n      label: a.label,\n      style: a.primary\n        ? \"display:flex;align-items:center;gap:7px;height:44px;padding:0 18px;border-radius:22px;background:#1F1B13;color:#F5EFE2;font-size:14px;font-weight:600;flex:none\"\n        : \"display:flex;align-items:center;gap:7px;height:44px;padding:0 18px;border-radius:22px;border:1.5px solid #C0B49B;color:#1F1B13;font-size:14px;font-weight:600;flex:none\",\n    }));\n\n    // `PersonDetail.roles` — grouped by job, because the motivating case is one\n    // man whose watch shop and bank office have different numbers.\n    const roles = [\n      { org: \"Sharif Printing\", title: \"Owner\", eps: [[\"phone\", \"+880 1712 445 908\", true], [\"email\", \"sharif.print@gmail.com\", false]] },\n      { org: \"SH Packaging\", title: \"Partner\", eps: [[\"phone\", \"+880 1955 220 114\", true]] },\n    ].map((r) => ({\n      org: r.org,\n      title: r.title,\n      eps: r.eps.map(([kind, value, mobile]) => ({\n        value,\n        isPhone: kind === \"phone\",\n        acts: mobile ? \"Call · WhatsApp\" : kind === \"phone\" ? \"Call\" : \"Email\",\n      })),\n    }));\n\n    const avatar = (c, ink) =>\n      `width:40px;height:40px;border-radius:13px;background:${c};display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:${ink};flex:none`;\n\n    const tints = [\n      [\"#C8901A\", \"#2A1D0A\"], [\"#7A8A5E\", \"#1B2113\"], [\"#A0603F\", \"#2A1508\"],\n      [\"#5F7A86\", \"#0F1B20\"], [\"#8C6B9E\", \"#1E1226\"], [\"#B08968\", \"#2A1B0C\"],\n    ];\n    // `contacts_screen` is one ListView with two count-labelled sections —\n    // people, then companies. No letter grouping, no alphabet rail, no tabs.\n    // `contactInitials` drops honorifics: \"Md. Sharif Hossain\" is S.H.\n    const initials = (n) => {\n      const skip = new Set([\"md\", \"md.\", \"mohammad\", \"mr\", \"mr.\", \"mrs\", \"mrs.\", \"ms\", \"ms.\", \"dr\", \"dr.\", \"engr\", \"engr.\", \"late\"]);\n      const parts = n.trim().split(/\\s+/).filter(Boolean);\n      const real = parts.filter((p) => !skip.has(p.toLowerCase()));\n      const use = real.length ? real : parts;\n      return use.length === 1\n        ? use[0][0].toUpperCase()\n        : (use[0][0] + use[use.length - 1][0]).toUpperCase();\n    };\n\n    const contacts = [];\n    const header = (label) => contacts.push({\n      isHeader: true, isPerson: false, isOrg: false, isRecord: false, label,\n      row: \"flex:none;display:flex;align-items:baseline;gap:8px;padding:18px 2px 6px\",\n    });\n    const row = \"flex:none;display:flex;align-items:center;gap:13px;padding:9px 2px\";\n\n    header(\"18 people\");\n    [\n      [\"Md. Sharif Hossain\", \"Sharif Printing · 2 businesses\", 3],\n      [\"Nabil Ahmed\", \"Nabil Fabrics\", 2],\n      [\"Mizanur Rahman\", \"Rahman Electric\", 1],\n      [\"Anwara Begum\", \"Meherun Tailors\", 1],\n    ].forEach(([name, subtitle, count], i) => {\n      const [bg, ink] = tints[i % tints.length];\n      contacts.push({\n        isHeader: false, isPerson: true, isOrg: false, isRecord: true, label: \"\",\n        name, subtitle,\n        initials: initials(name),\n        // Trailing chip only when cardCount > 1 — otherwise it is noise on\n        // every single row.\n        chip: count > 1 ? `${count} cards` : false,\n        avatar: avatar(bg, ink),\n        row,\n      });\n    });\n\n    header(\"11 companies\");\n    [\n      [\"Kalam Steel\", \"Grill & gate work\"],\n      [\"SH Packaging\", \"Nilkhet Book Market\"],\n    ].forEach(([name, subtitle]) => {\n      contacts.push({\n        isHeader: false, isPerson: false, isOrg: true, isRecord: true, label: \"\",\n        name, subtitle, initials: \"\", chip: false,\n        avatar: `width:40px;height:40px;border-radius:13px;background:#EFE6D2;border:1px solid #DCD1BA;display:flex;align-items:center;justify-content:center;flex:none`,\n        row,\n      });\n    });\n\n    const personFields = [\n      { label: \"Phone\", value: \"+880 1712 445 908\", src: \"card 24\" },\n      { label: \"Email\", value: \"sharif.print@gmail.com\", src: \"card 24\" },\n      { label: \"Second no.\", value: \"+880 1955 220 114\", src: \"card 09\" },\n    ];\n\n    const personCards = [\n      { when: \"14 Aug 2025\", tint: \"#DCCFB4\" },\n      { when: \"02 Jun 2025\", tint: \"#D3D6C0\" },\n      { when: \"19 Mar 2025\", tint: \"#DFD6C2\" },\n    ].map((c) => ({\n      ...c,\n      face: `position:relative;width:104px;height:66px;border-radius:9px;background:${c.tint};overflow:hidden;border:1px solid #D2C6AD`,\n      fold: foldStyle(true, \"#C8901A\"),\n    }));\n\n    // `OrgDetail.branches` — addresses, not statistics. The screen models a\n    // company with more than one branch, which is why address is a list.\n    const orgBranches = [\n      \"12/B Indira Rd, Farmgate, Dhaka 1215\",\n      \"Shop 44, Nilkhet Book Market\",\n    ];\n    const orgEndpoints = [\n      { value: \"+880 1712 445 908\", isPhone: true, acts: \"Call · WhatsApp\" },\n      { value: \"02 5504 1180\", isPhone: true, acts: \"Call\" },\n      { value: \"sharif.print@gmail.com\", isPhone: false, acts: \"Email\" },\n    ];\n    const orgPeople = [\n      { name: \"Md. Sharif Hossain\", role: \"Owner\", i: 0 },\n      { name: \"Rasel Mahmud\", role: \"Production\", i: 3 },\n    ].map((p) => ({\n      ...p,\n      initials: p.name.split(\" \").slice(-2).map((w) => w[0]).join(\"\"),\n      avatar: avatar(tints[p.i][0], tints[p.i][1]),\n    }));\n\n    // `_QueueRow` distinguishes exactly two problems, off `card.status`:\n    // ExtractionStatus.failed, or a partial read. There is no third state and\n    // no per-field guess — the fix happens on card detail, in the field list.\n    const repairs = [\n      { title: \"Unread card\", kind: \"Nothing was read from this card\", failed: true, tint: \"#DFCBBE\" },\n      { title: \"Kalam Steel\", kind: \"Only part of this card was read\", failed: false, tint: \"#D8CDBC\" },\n    ].map((r) => ({\n      ...r,\n      face: `position:relative;width:78px;height:48px;border-radius:7px;background:${r.tint};flex:none;overflow:hidden;border:1px solid #D2C6AD`,\n      rail: `height:4px;background:${r.failed ? \"#D9502A\" : \"#C8901A\"}`,\n      dot: `width:7px;height:7px;border-radius:50%;background:${r.failed ? \"#D9502A\" : \"#C8901A\"};flex:none`,\n    }));\n\n    const deleted = [\n      { title: \"Bashir Hardware\", left: \"28 days left\", tint: \"#C9BEA6\" },\n      { title: \"Unread card\", left: \"21 days left\", tint: \"#C4B9A1\" },\n      { title: \"Jamal Courier\", left: \"6 days left\", tint: \"#C9BEA6\" },\n    ].map((d) => ({\n      ...d,\n      face: `width:56px;height:36px;border-radius:6px;background:${d.tint};flex:none;border:1px solid #B8AC92`,\n    }));\n\n    // `DuplicateKind.card` — the commonest of the three, and the only one text\n    // cannot settle: both sides say the same thing, which is why they were\n    // flagged. So it is decided on the photographs, at the real 1.586 ratio,\n    // labelled Kept / Newer. The older scan is the survivor.\n    const dupeCardSides = [\n      { label: \"Kept\", detail: \"3 fields · 14 Aug\", tint: \"#DCCFB4\" },\n      { label: \"Newer\", detail: \"2 fields · 02 Sep\", tint: \"#D8CDBC\" },\n    ].map((s) => ({\n      ...s,\n      face: `position:relative;width:100%;height:88px;border-radius:11px;background:${s.tint};overflow:hidden;border:1px solid #D2C6AD`,\n      tag: `font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:${s.label === \"Kept\" ? \"#8A5A12\" : \"#9C8F73\"}`,\n    }));\n\n    // The other two kinds. Auto-resolution already links anything sharing a\n    // phone or an email, and it never links on a name — two different\n    // Md. Rahmans would collapse into one contact. So what reaches this queue\n    // is near-misses, and every button label changes with the kind.\n    const dupeQueue = [\n      { heading: \"Two contacts\", a: \"Nabil Ahmed\", b: \"Nabil A. Chowdhury\", signals: \"a website and an address\", yes: \"Same person\", no: \"Different people\" },\n    ];\n\n    const settingRow = (i, n) =>\n      `display:flex;align-items:center;gap:14px;padding:14px 16px;${i < n - 1 ? \"border-bottom:1px solid #EFE8D8\" : \"\"}`;\n    const sw = (on) =>\n      `width:46px;height:28px;border-radius:14px;flex:none;position:relative;background:${on ? \"#1F1B13\" : \"#DCD1BA\"};box-shadow:${on ? \"none\" : \"inset 0 1px 2px rgba(50,40,22,.2)\"}`;\n    const knob = (on) =>\n      `position:absolute;top:3px;${on ? \"right:3px\" : \"left:3px\"};width:22px;height:22px;border-radius:11px;background:${on ? \"#C8901A\" : \"#FBF7EE\"}`;\n\n    const rawGroups = [\n      { title: \"Capture\", rows: [\n        { label: \"Ask for a note every time\", hint: \"Off means the card saves silently\", on: true },\n        { label: \"Capture the back too\", hint: \"\", on: false },\n        { label: \"Photo quality\", hint: \"\", value: \"High\" },\n      ]},\n      { title: \"Your wallet\", rows: [\n        { label: \"Recently deleted\", hint: \"3 cards\", chev: true },\n        { label: \"Duplicates to review\", hint: \"4 waiting\", chev: true },\n        { label: \"Export everything\", hint: \"vCard + JSON to your files\", chev: true },\n      ]},\n      { title: \"Look\", rows: [\n        { label: \"Appearance\", hint: \"\", value: \"Follow system\" },\n        { label: \"Larger type\", hint: \"\", on: false },\n      ]},\n    ];\n    const settingGroups = rawGroups.map((g) => ({\n      title: g.title,\n      rows: g.rows.map((r, i) => {\n        let ctrl = \"\", ctrlStyle = \"\";\n        let knobStyle = \"display:none\";\n        if (r.chev) { ctrl = \"›\"; ctrlStyle = \"font-size:17px;color:#B3A992;flex:none\"; }\n        else if (r.value) { ctrl = r.value; ctrlStyle = \"font-size:13.5px;font-weight:600;color:#8A5A12;flex:none\"; }\n        else { ctrl = \"\"; ctrlStyle = sw(r.on); knobStyle = knob(r.on); }\n        return { label: r.label, hint: r.hint || false, ctrl, ctrlStyle, knobStyle, row: settingRow(i, g.rows.length) };\n      }),\n    }));\n\n    const states = [\n      { tag: \"Wallet empty\", title: \"Nothing in the wallet yet\", body: \"Scan the first card and say one line about why it mattered.\", cta: \"Scan a card\", dark: false, tint: \"#DCD1BA\", fold: false },\n      { tag: \"No results\", title: \"Nothing matched that\", body: \"Try what you needed them for, not their name. “cheap printing, small run”.\", cta: \"Clear the search\", dark: false, tint: \"#DCD1BA\", fold: false },\n      { tag: \"Loading\", title: \"Opening the wallet\", body: \"Three ghost cards, no spinner. The stack you are about to see, at 40%.\", cta: \"\", dark: false, tint: \"#DCD1BA\", fold: false },\n      { tag: \"Read failed\", title: \"That photo would not read\", body: \"The card is saved and searchable through your note. Rescan when you can.\", cta: \"Rescan the card\", dark: true, tint: \"#332821\", fold: true },\n    ].map((s) => ({\n      tag: s.tag,\n      title: s.title,\n      body: s.body,\n      cta: s.cta || \"\",\n      shell: `border-radius:26px;padding:22px 24px 26px;background:${s.dark ? \"#1F1B13\" : \"#E4DAC5\"};border:1px solid ${s.dark ? \"#332E25\" : \"#CFC3A9\"}`,\n      glyphWrap: \"display:flex;margin-bottom:20px\",\n      glyph: `position:relative;width:88px;height:56px;border-radius:11px;background:${s.tint};overflow:hidden;border:1px dashed ${s.dark ? \"#5A5142\" : \"#B8AC92\"}`,\n      glyphFold: foldStyle(s.fold, \"#D8A31A\"),\n      titleStyle: `font-family:'Instrument Serif',serif;font-size:27px;line-height:1.1;color:${s.dark ? \"#F4EEE0\" : \"#1F1B13\"}`,\n      bodyStyle: `margin-top:9px;font-size:14px;line-height:1.55;color:${s.dark ? \"#B5AC98\" : \"#6B6047\"};max-width:290px`,\n      ctaStyle: s.cta\n        ? `margin-top:18px;height:48px;border-radius:24px;background:${s.dark ? \"#F4EEE0\" : \"#1F1B13\"};color:${s.dark ? \"#1F1B13\" : \"#F5EFE2\"};display:flex;align-items:center;justify-content:center;font-size:14.5px;font-weight:600`\n        : \"display:none\",\n    }));\n\n    const L = [\n      [\"Page\", \"#E4DAC5\"], [\"Card / paper\", \"#FBF7EE\"], [\"Pocket\", \"#D6CAB1\"],\n      [\"Ink\", \"#1F1B13\"], [\"Ink muted\", \"#6B6047\"], [\"Ink faint\", \"#9C8F73\"],\n      [\"Hairline\", \"#C6BAA1\"], [\"Ochre\", \"#C8901A\"], [\"Ochre ink\", \"#8A5A12\"],\n      [\"Olive\", \"#7A8A5E\"], [\"Vermilion\", \"#D9502A\"],\n    ];\n    const D = [\n      [\"Page\", \"#15130F\"], [\"Card\", \"#1D1A15\"], [\"Pocket\", \"#0F0D0A\"],\n      [\"Ink\", \"#F0EADC\"], [\"Ink muted\", \"#8A8271\"], [\"Ink faint\", \"#6E6757\"],\n      [\"Hairline\", \"#2C2821\"], [\"Ochre\", \"#D8A31A\"], [\"Ochre ink\", \"#E8B84B\"],\n      [\"Olive\", \"#93A472\"], [\"Vermilion\", \"#E0641F\"],\n    ];\n    const chip = (hex, dark) =>\n      `width:30px;height:30px;border-radius:9px;background:${hex};flex:none;border:1px solid ${dark ? \"rgba(240,234,220,.14)\" : \"rgba(31,27,19,.12)\"}`;\n\n    return {\n      lightTokens: L.map(([name, hex]) => ({ name, hex, chip: chip(hex, false) })),\n      darkTokens: D.map(([name, hex]) => ({ name, hex, chip: chip(hex, true) })),\n      stack, stackDark, hits, fields, detailFields, contacts,\n      actionChips, roles, personCards, orgPeople, repairs, deleted,\n      orgBranches, orgEndpoints, dupeCardSides, dupeQueue,\n      settingGroups, states,\n      knobOn: knob(true), knobOff: knob(false),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
