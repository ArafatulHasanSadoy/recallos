name: recallos
description: "RecallOS — offline-first multilingual personal commerce memory"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  go_router: ^17.4.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  # Direct, though drift already pulls it in: the encryption migration opens
  # the old plaintext file itself to copy it across. See `hooks:` below for
  # what that `sqlite3` actually is.
  sqlite3: ^3.5.1
  collection: ^1.19.1
  google_mlkit_text_recognition: ^0.16.0
  image: ^4.9.1
  # The wallet export writes one zip. Direct, though `image` already
  # pulls it in: an export that depends on a transitive dep is one
  # `flutter pub upgrade` away from not compiling. Pure Dart, no native
  # code, and nothing to reach the network with.
  archive: ^4.0.9
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_local_ai: ^0.0.16
  url_launcher: ^6.3.2
  cunning_document_scanner: ^3.0.1
  share_plus: ^13.3.0
  open_filex: ^4.7.0
  # Fingerprint / face / device PIN, for the lock in front of the wallet. No
  # network of its own: the prompt is the OS's, and the answer is a boolean
  # that never leaves the device.
  local_auth: ^3.0.2
  # The Android Keystore, which is where the database key lives. The key itself
  # is generated on the phone and never written anywhere the app can read
  # without the OS unwrapping it first.
  #
  # Held at 10.x deliberately. Version 11 compiles against SDK 37, which the
  # Android Gradle plugin this project is on refuses to build against — and the
  # API used here is identical in both. Revisit when AGP moves.
  flutter_secure_storage: ^10.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0

  # Both arrive transitively with path_provider; named here because the back
  # capture test substitutes a fake documents directory, which needs the
  # platform interface directly. Test-only.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
# Ship SQLCipher instead of plain SQLite.
#
# `package:sqlite3` bundles one of three builds; this picks the one that can
# encrypt. It is the whole of the "database encryption" feature at the build
# level — everything else is key management, which lives in
# `lib/core/db/encrypted_database.dart`.
#
# Worth knowing: on a plain SQLite build, `PRAGMA key` is not an error. SQLite
# ignores pragmas it does not recognise, so a build where this line went
# missing would run happily and write everything in the clear. That is why the
# app checks `PRAGMA cipher_version` at startup and reports what it finds
# rather than assuming.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true

  assets:
    # Model2Vec potion-base-8M, exported by tool/embeddings/export_potion.py.
    # ~8 MB, and the reason semantic search runs on every device rather than
    # only on phones with platform AI.
    - assets/embedding/
    # Logo mark and app icon source. See design/DESIGN.md §6.
    - assets/brand/

  # Bundled, never fetched. `google_fonts` downloads on first run, which would
  # put a network call in an app whose release build has no INTERNET
  # permission. See design/DESIGN.md §1.
  #
  # Archivo is declared once as its variable file rather than as four static
  # instances: Google ships no static builds for it, and the weight axis is
  # driven explicitly through `fontVariations` in AppText, so the four weights
  # the design calls for all render from this one 640 KB file.
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo.ttf
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic


  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
